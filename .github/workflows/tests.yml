name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --outfile /tmp/honeytoken-template.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "${RUNNER_TEMP}"
          curl --fail --silent --show-error --location "${base}/gitleaks_${version}_linux_x64.tar.gz" --output gitleaks.tar.gz
          curl --fail --silent --show-error --location "${base}/gitleaks_${version}_checksums.txt" --output checksums.txt
          expected=$(awk '/linux_x64.tar.gz$/ {print $1}' checksums.txt)
          test -n "$expected"
          echo "$expected  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --log-opts=--all "${GITHUB_WORKSPACE}"
